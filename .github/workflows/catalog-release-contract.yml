name: Catalog Release contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete Runner history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.9"
      - name: Install the Runner
        run: python -m pip install -e .
      - name: Exercise manifest, tag, asset, and offline-bundle verification
        run: python -m unittest tests/test_catalog_release.py -v
      - name: Exercise frozen source validation compatibility
        run: python -m unittest tests/test_source_validation_cli.py -v
      - name: Exercise build and certification compatibility
        run: >-
          python -m unittest
          tests/test_artifact_builder_cli.py
          tests/test_artifact_certification_cli.py
          -v
      - name: Prepare exact internal-fixture images
        run: |
          docker pull --platform linux/amd64 docker.io/library/python@sha256:69e18bd8d831d88e0ef70239dc7771ab7c28bc296ae78ac75cde71e60aa4434f
          docker pull --platform linux/amd64 docker.io/library/busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
      - name: Prove the second executable Language Environment
        env:
          RPS_RUN_DOCKER_INTEGRATION: "1"
          RPS_DOCKER_PLATFORM: linux/amd64
        run: python -m unittest tests.test_multi_language_environment -v
      - name: Configure the disposable proof release identity
        run: |
          git config user.email catalog-proof@example.invalid
          git config user.name "Catalog Independence Proof"
      - name: Prove the isolated Runner catalog release
        run: >-
          ./freeze-tournament-catalog prove
          catalog-independence-${{ github.sha }}
          --bundle ${{ runner.temp }}/rps-runner-catalog.bundle
          --evidence ${{ runner.temp }}/catalog-independence-evidence.json
      - name: Retain the release bundle and independence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-independence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rps-runner-catalog.bundle
            ${{ runner.temp }}/catalog-independence-evidence.json
          if-no-files-found: error
          retention-days: 90
