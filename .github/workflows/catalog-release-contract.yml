name: Catalog Release contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete Runner history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.9"
      - name: Install the Runner
        run: python -m pip install -e .
      - name: Exercise manifest, tag, asset, and offline-bundle verification
        run: python -m unittest tests/test_catalog_release.py -v
      - name: Exercise frozen source validation compatibility
        run: python -m unittest tests/test_source_validation_cli.py -v
      - name: Exercise build and certification compatibility
        run: >-
          python -m unittest
          tests/test_artifact_builder_cli.py
          tests/test_artifact_certification_cli.py
          -v
      - name: Exercise Java catalog and Seed Adapter contracts
        run: python -m unittest tests.test_java_language_environment.JavaLanguageEnvironmentTests -v
      - name: Exercise C# catalog and Seed Adapter contracts
        run: python -m unittest tests.test_csharp_language_environment.CSharpLanguageEnvironmentTests -v
      - name: Exercise Clojure catalog and Seed Adapter contracts
        run: python -m unittest tests.test_clojure_language_environment.ClojureLanguageEnvironmentTests -v
      - name: Prepare exact internal-fixture images
        run: |
          docker pull --platform linux/amd64 docker.io/library/python@sha256:ff83a535339812dd72e69c93b3c48ddf7c85a324d6330af5797c82a255dbeef4
          docker pull --platform linux/amd64 docker.io/library/busybox@sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f
          docker pull --platform linux/amd64 docker.io/library/eclipse-temurin@sha256:78e1c29a95bd36513e7d67eb730b699c6e6f46ef975e35e937c66eb726539609
          docker pull --platform linux/amd64 docker.io/library/eclipse-temurin@sha256:c650e8097620a27a61f476d2a269e02078dc9f316136ecd9821dedd98b89e719
          docker pull --platform linux/amd64 docker.io/library/clojure@sha256:c50576e2fcb26300d09dae1f3b5d3a7a1482334c5113ea7bcd3f6a17b0141aca
          docker pull --platform linux/amd64 mcr.microsoft.com/dotnet/sdk@sha256:7a91ccecc26d71bf7688c627a6b5eae2e27bb2cd1e37e8abe738348904245692
          docker pull --platform linux/amd64 mcr.microsoft.com/dotnet/runtime@sha256:4d3f0fed221262600ace6384e809d7954a2d77266bc2f08193f763c5702bedce
      - name: Prove the second executable Language Environment
        env:
          RPS_RUN_DOCKER_INTEGRATION: "1"
          RPS_DOCKER_PLATFORM: linux/amd64
        run: python -m unittest tests.test_multi_language_environment -v
      - name: Prove Java Linux/AMD64 Advisory Validation
        env:
          RPS_RUN_DOCKER_INTEGRATION: "1"
          RPS_DOCKER_PLATFORM: linux/amd64
        run: >-
          python -m unittest
          tests.test_java_language_environment.JavaLanguageEnvironmentDockerTests
          -v
      - name: Prove C# Linux/AMD64 Advisory Validation
        env:
          RPS_RUN_DOCKER_INTEGRATION: "1"
          RPS_DOCKER_PLATFORM: linux/amd64
        run: >-
          python -m unittest
          tests.test_csharp_language_environment.CSharpLanguageEnvironmentDockerTests
          -v
      - name: Prove Clojure Linux/AMD64 Advisory Validation
        env:
          RPS_RUN_DOCKER_INTEGRATION: "1"
          RPS_DOCKER_PLATFORM: linux/amd64
        run: >-
          python -m unittest
          tests.test_clojure_language_environment.ClojureLanguageEnvironmentDockerTests
          -v
      - name: Configure the disposable proof release identity
        run: |
          git config user.email catalog-proof@example.invalid
          git config user.name "Catalog Independence Proof"
      - name: Prove the isolated Runner catalog release
        run: >-
          ./freeze-tournament-catalog prove
          catalog-independence-${{ github.sha }}
          --bundle ${{ runner.temp }}/rps-runner-catalog.bundle
          --evidence ${{ runner.temp }}/catalog-independence-evidence.json
          --release-notes ${{ runner.temp }}/catalog-release-notes.md
      - name: Retain the release bundle and independence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-independence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rps-runner-catalog.bundle
            ${{ runner.temp }}/catalog-independence-evidence.json
            ${{ runner.temp }}/catalog-release-notes.md
          if-no-files-found: error
          retention-days: 90
