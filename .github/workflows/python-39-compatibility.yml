name: Python 3.9 compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install -e .
      - name: Run unit tests at the supported minimum Python version
        run: python -m unittest discover -s tests
