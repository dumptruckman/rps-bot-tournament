name: Native AMD64 portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ratify-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Verify installed offline presentation assets
        run: rps-tournament verify-presentation-assets
      - name: Cache the pinned AMD64 Python runtime
        run: >-
          docker pull --platform linux/amd64
          docker.io/library/python@sha256:69e18bd8d831d88e0ef70239dc7771ab7c28bc296ae78ac75cde71e60aa4434f
      - name: Prove the native AMD64 build and execution path
        run: scripts/ratify-native-platform.sh linux/amd64 build/native-amd64-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-amd64-evidence
          path: build/native-amd64-evidence
