[metadata]
name = rps-tournament
version = 0.1.0
description = Local Match and Tournament Runner for RPS Bot Artifacts

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include =
    rps_runner*

[options.package_data]
rps_runner.engine =
    seccomp-docker-execution-v1.json

[options.entry_points]
console_scripts =
    rps-run = rps_runner.cli:main
    rps-build-artifact = rps_runner.artifact_cli:main
    rps-certify-artifact = rps_runner.certification_cli:main
    rps-profile-probe = rps_runner.profile_probe:main
    rps-validate-source = rps_runner.source_cli:main
    rps-tournament = rps_runner.tournament_cli:main
    rps-tournament-capacity = rps_runner.tournament.capacity:main
