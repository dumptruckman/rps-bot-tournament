[metadata]
name = rps-tournament
version = 0.1.0
description = Local match engine for the Rock-Paper-Scissors bot tournament

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include =
    rps_runner*

[options.entry_points]
console_scripts =
    rps-run = rps_runner.cli:main
